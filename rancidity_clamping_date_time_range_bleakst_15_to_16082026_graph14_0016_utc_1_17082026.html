<script>
(function() {

  /* DOM elements */
  const wrapper = document.getElementById("panzoom-wrapper");
  const svgObject = document.getElementById("svgObject");

  const zoomInBtn = document.getElementById("zoom-in");
  const zoomOutBtn = document.getElementById("zoom-out");
  const zoomResetBtn = document.getElementById("zoom-reset");
  const openMinimapBtn = document.getElementById("open-minimap");

  const minimapOverlay = document.getElementById("minimap-overlay");
  const minimapCloseBtn = document.getElementById("minimap-close");
  const minimapContainer = document.getElementById("minimap-container");
  const minimapViewport = document.getElementById("minimap-viewport");

  /* Pan/Zoom state */
  let svg, vb;
  let viewX = 0, viewY = 0, viewW = 0, viewH = 0;

  let isDragging = false;
  let lastX = 0, lastY = 0;
  let vx = 0, vy = 0;
  let inertiaActive = false;

  const MIN_ZOOM = 0.2;
  const MAX_ZOOM = 10;

  /* Load SVG */
  svgObject.addEventListener("load", () => {
    svg = svgObject.contentDocument.querySelector("svg");
    vb = svg.viewBox.baseVal;

    viewX = vb.x;
    viewY = vb.y;
    viewW = vb.width;
    viewH = vb.height;

    /* Create minimap SVG */
    const mini = svg.cloneNode(true);
    mini.removeAttribute("width");
    mini.removeAttribute("height");
    minimapContainer.appendChild(mini);

    updateViewBox();
  });

  /* Update SVG viewBox */
  function updateViewBox() {
    svg.setAttribute("viewBox", `${viewX} ${viewY} ${viewW} ${viewH}`);
    updateMinimap();
  }

  /* Zoom at point */
  function zoomAt(factor, cx, cy) {
    const newW = viewW / factor;
    const newH = viewH / factor;

    if (newW < vb.width * MIN_ZOOM || newW > vb.width * MAX_ZOOM) return;

    const dx = (cx / wrapper.clientWidth) * viewW;
    const dy = (cy / wrapper.clientHeight) * viewH;

    viewX += dx - dx / factor;
    viewY += dy - dy / factor;

    viewW = newW;
    viewH = newH;

    updateViewBox();
  }

  /* Pan */
  function pan(dx, dy) {
    viewX -= dx * (viewW / wrapper.clientWidth);
    viewY -= dy * (viewH / wrapper.clientHeight);
    updateViewBox();
  }

  /* Inertia */
  function startInertia() {
    if (inertiaActive) return;
    inertiaActive = true;

    function step() {
      vx *= 0.9;
      vy *= 0.9;

      pan(vx, vy);

      if (Math.abs(vx) < 0.1 && Math.abs(vy) < 0.1) {
        inertiaActive = false;
        return;
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* Minimap update */
  function updateMinimap() {
    const miniW = minimapContainer.clientWidth;
    const miniH = minimapContainer.clientHeight;

    const scaleX = miniW / vb.width;
    const scaleY = miniH / vb.height;

    minimapViewport.style.width = (viewW * scaleX) + "px";
    minimapViewport.style.height = (viewH * scaleY) + "px";
    minimapViewport.style.left = (viewX * scaleX) + "px";
    minimapViewport.style.top = (viewY * scaleY) + "px";
  }

  /* Zoom buttons */
  zoomInBtn.onclick = () => zoomAt(1.2, wrapper.clientWidth/2, wrapper.clientHeight/2);
  zoomOutBtn.onclick = () => zoomAt(0.8, wrapper.clientWidth/2, wrapper.clientHeight/2);

  zoomResetBtn.onclick = () => {
    viewX = vb.x;
    viewY = vb.y;
    viewW = vb.width;
    viewH = vb.height;
    updateViewBox();
  };

  /* Minimap overlay */
  openMinimapBtn.onclick = () => minimapOverlay.style.display = "block";
  minimapCloseBtn.onclick = () => minimapOverlay.style.display = "none";

  /* Mouse pan */
  wrapper.addEventListener("pointerdown", e => {
    isDragging = true;
    inertiaActive = false;
    lastX = e.clientX;
    lastY = e.clientY;
    vx = vy = 0;
  });

  wrapper.addEventListener("pointermove", e => {
    if (!isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    pan(dx, dy);
    vx = dx;
    vy = dy;
    lastX = e.clientX;
    lastY = e.clientY;
  });

  wrapper.addEventListener("pointerup", () => {
    isDragging = false;
    startInertia();
  });

  /* Wheel zoom */
  wrapper.addEventListener("wheel", e => {
    e.preventDefault();
    const rect = wrapper.getBoundingClientRect();
    zoomAt(1 + (-e.deltaY * 0.002), e.clientX - rect.left, e.clientY - rect.top);
  });

})();
</script>
