<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Storyboard Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: #111;
        overflow: auto;      /* ← MUST BE AUTO, NOT HIDDEN */
    }

    #svgObject {
        display: block;
        width: auto;
        height: auto;
        max-width: none;
        max-height: none;
    }
</style>
</head>

<body>

<embed id="svgObject"
       type="image/svg+xml"
       src="Bayeux_Tapestry_Diplomacy_King_Charles_III_Queen_Camilla.svg">
</embed>

</body>
</html>
