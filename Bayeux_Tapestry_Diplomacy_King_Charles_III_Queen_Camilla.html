<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Storyboard Viewer: Bayeux_Tapestry_Diplomacy_King_Charles_III_Queen_Camilla</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #111;
        overflow: visible;          /* ← NO CLIPPING */
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
    }

    header {
        padding: 0.5rem 1rem;
        background: #222;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        color: #ddd;
    }

    main {
        flex: 1;
        position: relative;
        overflow: visible;          /* ← NO CLIPPING */
        background: #111;
        touch-action: none;
    }

    #panzoom-wrapper {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: visible;          /* ← NO CLIPPING */
        background: #111;
        touch-action: none;
    }

    #svgObject {
        width: auto;                /* ← NATURAL SIZE */
        height: auto;
        max-width: none;
        max-height: none;
        display: block;
        pointer-events: none;
    }

    #zoom-controls {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 20;
        display: flex;
        gap: 6px;
    }

    #zoom-controls button {
        padding: 6px 10px;
        font-size: 18px;
        background: #222;
        color: #eee;
        border: 1px solid #444;
        border-radius: 4px;
        cursor: pointer;
    }

    #zoom-controls button:hover {
        background: #333;
    }

    /* Minimap overlay */
    #minimap-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        display: none;
        z-index: 50;
    }

    #minimap-close {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 32px;
        background: none;
        border: none;
        color: #fff;
        cursor: pointer;
    }

    #minimap-container {
        position: absolute;
        inset: 50px;
        background: #222;
        border: 2px solid #555;
        overflow: hidden;
    }

    #minimap-container svg {
        width: 100%;
        height: 100%;
    }

    #minimap-viewport {
        position: absolute;
        border: 2px solid #00adee;
        pointer-events: none;
    }
</style>
</head>

<body>

<header>
    <h1>Storyboard Viewer</h1>
    <div class="controls">
        <button onclick="location.reload()">Refresh</button>
        <button onclick="window.location.href='https://axda.github.io/Blu/axd_archive_index_2.html'">
            Back to Archive Index
        </button>
    </div>
</header>

<main>

    <div id="zoom-controls">
        <button id="zoom-in">+</button>
        <button id="zoom-out">−</button>
        <button id="zoom-reset">⟳</button>
        <button id="open-minimap">☰</button>
    </div>

    <div id="panzoom-wrapper">
        <object id="svgObject" type="image/svg+xml"
                data="Bayeux_Tapestry_Diplomacy_King_Charles_III_Queen_Camilla.svg"></object>
    </div>

    <div id="minimap-overlay">
        <button id="minimap-close">×</button>
        <div id="minimap-container"></div>
        <div id="minimap-viewport"></div>
    </div>

</main>

<script>
(function() {

const wrapper = document.getElementById("panzoom-wrapper");
const svgObject = document.getElementById("svgObject");

let svg, vb;
let viewX, viewY, viewW, viewH;

svgObject.addEventListener("load", () => {
    svg = svgObject.contentDocument.querySelector("svg");
    vb = svg.viewBox.baseVal;

    viewX = vb.x;
    viewY = vb.y;
    viewW = vb.width;
    viewH = vb.height;

    updateViewBox();
});

function clampViewBox() {
    if (viewX < vb.x) viewX = vb.x;
    if (viewY < vb.y) viewY = vb.y;
    if (viewX + viewW > vb.x + vb.width) viewX = vb.x + vb.width - viewW;
    if (viewY + viewH > vb.y + vb.height) viewY = vb.y + vb.height - viewH;
}


function updateViewBox() {
    clampViewBox();
    svg.setAttribute("viewBox", `${viewX} ${viewY} ${viewW} ${viewH}`);
}


function zoomAt(factor, cx, cy) {
    const newW = viewW / factor;
    const newH = viewH / factor;

    const dx = (cx / wrapper.clientWidth) * viewW;
    const dy = (cy / wrapper.clientHeight) * viewH;

    viewX += dx - dx / factor;
    viewY += dy - dy / factor;

    viewW = newW;
    viewH = newH;

    updateViewBox();
}

function pan(dx, dy) {
    viewX -= dx * (viewW / wrapper.clientWidth);
    viewY -= dy * (viewH / wrapper.clientHeight);
    updateViewBox();
}

let dragging = false;
let lastX = 0, lastY = 0;

wrapper.addEventListener("pointerdown", e => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
});

wrapper.addEventListener("pointermove", e => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    pan(dx, dy);
    lastX = e.clientX;
    lastY = e.clientY;
});

wrapper.addEventListener("pointerup", () => dragging = false);

wrapper.addEventListener("wheel", e => {
    e.preventDefault();
    const rect = wrapper.getBoundingClientRect();
    zoomAt(1 + (-e.deltaY * 0.002), e.clientX - rect.left, e.clientY - rect.top);
});

})();
</script>

</body>
</html>
