<body>

  </div>

  <!-- Pan/Zoom Wrapper -->
  <div id="panzoom-wrapper">
    <object
      id="svgObject"
      type="image/svg+xml"
      data="Bayeux_Tapestry_Diplomacy_King_Charles_III_Queen_Camilla.svg">
    </object>

    <div id="minimap-container"></div>

<style>
  body, html {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #111;
  }

  #panzoom-wrapper {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: visible;      /* ← NO CLIPPING */
    touch-action: none;
    background: #111;
  }

  #svgObject {
    width: auto;            /* ← NOT forced to 100% */
    height: auto;
    max-width: none;
    max-height: none;
    display: block;
    pointer-events: none;   /* viewer handles events */
  }

  #zoom-controls {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 20;
    display: flex;
    gap: 6px;
  }

  #zoom-controls button {
    padding: 6px 10px;
    font-size: 18px;
    background: #222;
    color: #eee;
    border: 1px solid #444;
    border-radius: 4px;
    cursor: pointer;
  }

  #zoom-controls button:hover {
    background: #333;
  }

  /* Full‑screen minimap overlay */
  #minimap-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    z-index: 50;
  }

  #minimap-close {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 32px;
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
  }

  #minimap-container {
    position: absolute;
    inset: 50px;
    background: #222;
    border: 2px solid #555;
    overflow: hidden;
  }

  #minimap-container svg {
    width: 100%;
    height: 100%;
  }

  #minimap-viewport {
    position: absolute;
    border: 2px solid #00adee;
    pointer-events: none;
  }
</style>

<script>
(function() {

  /* DOM elements */
(function() {

const wrapper = document.getElementById("panzoom-wrapper");
const svgObject = document.getElementById("svgObject");

let svg, vb;
let viewX, viewY, viewW, viewH;

svgObject.addEventListener("load", () => {
    svg = svgObject.contentDocument.querySelector("svg");
    vb = svg.viewBox.baseVal;

    viewX = vb.x;
    viewY = vb.y;
    viewW = vb.width;
    viewH = vb.height;

    updateViewBox();
});

function updateViewBox() {
    svg.setAttribute("viewBox", `${viewX} ${viewY} ${viewW} ${viewH}`);
}

/* Zoom at point */
function zoomAt(factor, cx, cy) {
    const newW = viewW / factor;
    const newH = viewH / factor;

    const dx = (cx / wrapper.clientWidth) * viewW;
    const dy = (cy / wrapper.clientHeight) * viewH;

    viewX += dx - dx / factor;
    viewY += dy - dy / factor;

    viewW = newW;
    viewH = newH;

    updateViewBox();
}

/* Pan */
function pan(dx, dy) {
    viewX -= dx * (viewW / wrapper.clientWidth);
    viewY -= dy * (viewH / wrapper.clientHeight);
    updateViewBox();
}

/* Mouse drag */
let dragging = false;
let lastX = 0, lastY = 0;

wrapper.addEventListener("pointerdown", e => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
});

wrapper.addEventListener("pointermove", e => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    pan(dx, dy);
    lastX = e.clientX;
    lastY = e.clientY;
});

wrapper.addEventListener("pointerup", () => dragging = false);

/* Wheel zoom */
wrapper.addEventListener("wheel", e => {
    e.preventDefault();
    const rect = wrapper.getBoundingClientRect();
    zoomAt(1 + (-e.deltaY * 0.002), e.clientX - rect.left, e.clientY - rect.top);
});

})();

</script>
