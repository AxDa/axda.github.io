<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>core_truth_clamping_graph23_panzoom</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overscroll-behavior: none;
    }

    header {
        padding: 0.5rem 1rem;
        background: #222;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    header h1 {
        font-size: 0.9rem;
        margin: 0;
        color: #ddd;
    }

    .controls {
        display: flex;
        gap: 0.5rem;
    }

    button {
        padding: 0.35rem 0.75rem;
        border-radius: 4px;
        border: 1px solid #555;
        background: #333;
        color: #eee;
        cursor: pointer;
        font-size: 0.85rem;
    }

    button:hover {
        background: #444;
    }

    main {
        flex: 1;
        overflow: hidden;
        background: #111;
        touch-action: none;
        position: relative;
    }

    #panzoom-wrapper {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: relative;
    }

    #panzoom-content {
        transform-origin: 0 0;
        will-change: transform;
    }

    object {
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: auto;
    }

    #zoom-controls {
        position: absolute;
        top: 15px;
        left: 15px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 10;
    }

    #zoom-controls button {
        width: 40px;
        height: 40px;
        font-size: 1.2rem;
        font-weight: bold;
        border-radius: 6px;
    }

    #fit-controls {
        position: absolute;
        top: 15px;
        left: 70px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 10;
    }

    #fit-controls button {
        width: 90px;
        height: 32px;
        font-size: 0.8rem;
        border-radius: 6px;
    }

    #minimap {
        position: absolute;
        right: 15px;
        bottom: 15px;
        width: 180px;
        height: 180px;
        border: 2px solid #666;
        background: #222;
        overflow: hidden;
        opacity: 0.85;
        z-index: 10;
    }

    #minimap svg {
        width: 100%;
        height: 100%;
    }

    #minimap-viewport {
        position: absolute;
        border: 2px solid #00ffff;
        pointer-events: none;
    }
</style>
</head>

<body>

<header>
    <h1>core_truth_clamping_graph23_panzoom</h1>
    <div class="controls">
        <button onclick="location.reload()">Refresh</button>
        <button onclick="window.location.href='https://axda.github.io/Blu/axd_archive_index_2.html'">Back</button>
    </div>
</header>

<main>

    <!-- Zoom Buttons -->
    <div id="zoom-controls">
        <button id="zoom-in">+</button>
        <button id="zoom-out">−</button>
        <button id="zoom-reset">⟳</button>
    </div>

    <!-- Fit Buttons -->
    <div id="fit-controls">
        <button id="fit-width">Fit Width</button>
        <button id="fit-height">Fit Height</button>
    </div>

    <!-- Minimap -->
    <div id="minimap">
        <div id="minimap-viewport"></div>
    </div>

    <!-- Pan/Zoom Container -->
    <div id="panzoom-wrapper">
        <div id="panzoom-content">
            <object id="svgObject" type="image/svg+xml"
                data="clamping_date_time_range_bleakst_17_thru_20092026_graph23_0615_utc_1_21092026.svg">
            </object>
        </div>
    </div>

</main>

<script>
(function() {

    const wrapper = document.getElementById("panzoom-wrapper");
    const content = document.getElementById("panzoom-content");
    const svgObject = document.getElementById("svgObject");

    let scale = 1;
    let originX = 0;
    let originY = 0;

    let isDragging = false;
    let lastX = 0;
    let lastY = 0;

    let pinchDist = 0;
    let vb = null;

    function applyTransform() {
        content.style.transform =
            `translate(${originX}px, ${originY}px) scale(${scale})`;
        updateMinimap();
    }

    function centerCamera() {
        const w = wrapper.clientWidth;
        const h = wrapper.clientHeight;
        originX = (w - vb.width * scale) / 2;
        originY = (h - vb.height * scale) / 2;
    }

    function zoomAtPoint(factor, cx, cy) {
        const prevScale = scale;
        scale *= factor;

        originX = cx - (cx - originX) * (scale / prevScale);
        originY = cy - (cy - originY) * (scale / prevScale);

        applyTransform();
    }

    svgObject.addEventListener("load", () => {
        const svg = svgObject.contentDocument.querySelector("svg");
        if (!svg) return;

        vb = svg.viewBox.baseVal;

        const w = wrapper.clientWidth;
        const h = wrapper.clientHeight;

        const scaleX = w / vb.width;
        const scaleY = h / vb.height;

        scale = Math.min(scaleX, scaleY) * 0.95;

        centerCamera();

        const clone = svg.cloneNode(true);
        clone.removeAttribute("width");
        clone.removeAttribute("height");
        clone.style.width = "100%";
        clone.style.height = "100%";
        document.getElementById("minimap").appendChild(clone);

        applyTransform();
    });

    document.getElementById("zoom-in").onclick = () => {
        zoomAtPoint(1.2, wrapper.clientWidth / 2, wrapper.clientHeight / 2);
    };

    document.getElementById("zoom-out").onclick = () => {
        zoomAtPoint(0.8, wrapper.clientWidth / 2, wrapper.clientHeight / 2);
    };

    document.getElementById("zoom-reset").onclick = () => {
        const w = wrapper.clientWidth;
        const h = wrapper.clientHeight;

        const scaleX = w / vb.width;
        const scaleY = h / vb.height;

        scale = Math.min(scaleX, scaleY) * 0.95;
        centerCamera();
        applyTransform();
    };

    /* FIT WIDTH */
    document.getElementById("fit-width").onclick = () => {
        const w = wrapper.clientWidth;
        scale = w / vb.width;
        centerCamera();
        applyTransform();
    };

    /* FIT HEIGHT */
    document.getElementById("fit-height").onclick = () => {
        const h = wrapper.clientHeight;
        scale = h / vb.height;
        centerCamera();
        applyTransform();
    };

    wrapper.addEventListener("wheel", e => {
        e.preventDefault();
        const factor = e.deltaY > 0 ? 0.9 : 1.1;
        zoomAtPoint(factor, e.clientX, e.clientY);
    });

    wrapper.addEventListener("pointerdown", e => {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
    });

    wrapper.addEventListener("pointermove", e => {
        if (!isDragging) return;
        originX += e.clientX - lastX;
        originY += e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        applyTransform();
    });

    wrapper.addEventListener("pointerup", () => isDragging = false);
    wrapper.addEventListener("pointerleave", () => isDragging = false);

    wrapper.addEventListener("touchmove", e => {
        if (e.touches.length === 2) {
            e.preventDefault();
            const [t1, t2] = e.touches;
            const dist = Math.hypot(
                t1.pageX - t2.pageX,
                t1.pageY - t2.pageY
            );
            if (pinchDist) {
                const factor = dist / pinchDist;
                zoomAtPoint(factor, (t1.pageX + t2.pageX) / 2,
                                   (t1.pageY + t2.pageY) / 2);
            }
            pinchDist = dist;
        }
    });

    wrapper.addEventListener("touchend", () => pinchDist = 0);

    function updateMinimap() {
        const mini = document.getElementById("minimap");
        const vp = document.getElementById("minimap-viewport");

        const scaleX = mini.clientWidth / vb.width;
        const scaleY = mini.clientHeight / vb.height;

        vp.style.width = (wrapper.clientWidth / scale * scaleX) + "px";
        vp.style.height = (wrapper.clientHeight / scale * scaleY) + "px";

        vp.style.left = (-originX / scale * scaleX) + "px";
        vp.style.top = (-originY / scale * scaleY) + "px";
    }

})();
</script>

</body>
</html>
