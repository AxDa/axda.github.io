<script>
    const svg = document.getElementById('scene');
    let viewBox = svg.viewBox.baseVal;

    // Initial camera state
    const initialView = {
        x: viewBox.x,
        y: viewBox.y,
        width: viewBox.width,
        height: viewBox.height
    };

    // ============================
    // MOUSE PAN
    // ============================
    let isPanning = false;
    let startX, startY;

    svg.addEventListener('mousedown', e => {
        isPanning = true;
        startX = e.clientX;
        startY = e.clientY;
    });

    svg.addEventListener('mousemove', e => {
        if (!isPanning) return;
        let dx = (startX - e.clientX);
        let dy = (startY - e.clientY);
        viewBox.x += dx;
        viewBox.y += dy;
        startX = e.clientX;
        startY = e.clientY;
    });

    svg.addEventListener('mouseup', () => isPanning = false);
    svg.addEventListener('mouseleave', () => isPanning = false);

    // ============================
    // MOUSE WHEEL ZOOM
    // ============================
    svg.addEventListener('wheel', e => {
        e.preventDefault();
        const scale = 1.1;
        const zoomIn = e.deltaY < 0;

        if (zoomIn) {
            viewBox.width /= scale;
            viewBox.height /= scale;
        } else {
            viewBox.width *= scale;
            viewBox.height *= scale;
        }
    });

    // ============================
    // TOUCH PAN + PINCH ZOOM
    // ============================
    let lastTouchDistance = null;
    let lastTouchX = null;
    let lastTouchY = null;

    function getDistance(t1, t2) {
        return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    }

    svg.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
            lastTouchDistance = getDistance(e.touches[0], e.touches[1]);
        }
    });

    svg.addEventListener('touchmove', e => {
        e.preventDefault();

        if (e.touches.length === 1) {
            // PAN
            let dx = (lastTouchX - e.touches[0].clientX);
            let dy = (lastTouchY - e.touches[0].clientY);
            viewBox.x += dx;
            viewBox.y += dy;
            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;

        } else if (e.touches.length === 2) {
            // PINCH ZOOM
            let newDistance = getDistance(e.touches[0], e.touches[1]);
            if (lastTouchDistance) {
                let scale = newDistance / lastTouchDistance;
                viewBox.width /= scale;
                viewBox.height /= scale;
            }
            lastTouchDistance = newDistance;
        }
    });

    svg.addEventListener('touchend', () => {
        lastTouchDistance = null;
        lastTouchX = null;
        lastTouchY = null;
    });

    // ============================
    // DOUBLE‑TAP ZOOM (mobile‑friendly)
    // ============================
    let lastTapTime = 0;
    let doubleTapZoomed = false;

    svg.addEventListener('touchend', e => {
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTapTime;

        // Detect double‑tap (under 300ms)
        if (tapLength < 300 && e.touches.length === 0) {
            // Get tap position relative to viewport
            const touch = e.changedTouches[0];
            const rect = svg.getBoundingClientRect();
            const tapX = touch.clientX - rect.left;
            const tapY = touch.clientY - rect.top;

            // Convert tap position to SVG coordinates
            const svgX = viewBox.x + (tapX / rect.width) * viewBox.width;
            const svgY = viewBox.y + (tapY / rect.height) * viewBox.height;

            if (!doubleTapZoomed) {
                // Zoom IN toward tap point
                const factor = 0.5; // zoom in 2×
                viewBox.width *= factor;
                viewBox.height *= factor;

                // Center on tap point
                viewBox.x = svgX - viewBox.width / 2;
                viewBox.y = svgY - viewBox.height / 2;

                doubleTapZoomed = true;
            } else {
                // Zoom OUT (restore original)
                resetCamera();
                doubleTapZoomed = false;
            }
        }

        lastTapTime = currentTime;
    });

    // ============================
    // ZOOM‑TO‑FIT
    // ============================
    function zoomToFit() {
        const viewport = document.getElementById('viewport');
        const vw = viewport.clientWidth;
        const vh = viewport.clientHeight;

        const sceneRatio = initialView.width / initialView.height;
        const viewportRatio = vw / vh;

        if (sceneRatio > viewportRatio) {
            // Fit width
            viewBox.width = initialView.width;
            viewBox.height = initialView.width / viewportRatio;
        } else {
            // Fit height
            viewBox.height = initialView.height;
            viewBox.width = initialView.height * viewportRatio;
        }

        viewBox.x = initialView.x;
        viewBox.y = initialView.y;
    }

    // ============================
    // RESET CAMERA
    // ============================
    function resetCamera() {
        viewBox.x = initialView.x;
        viewBox.y = initialView.y;
        viewBox.width = initialView.width;
        viewBox.height = initialView.height;
    }
</script>
