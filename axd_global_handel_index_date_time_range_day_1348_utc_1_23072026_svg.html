  button:hover {

  main {

<main>
  <div id="panzoom-wrapper">
    <div id="panzoom-content">
      <object
        id="svgObject"
        type="image/svg+xml"
        data="axd_global_handel_index_date_time_range_day_1348_utc_1_23072026.svg">
      </object>
    </div>
  </div>
</main>

<script>
/* Lightweight pan + zoom engine */
(function() {
  const wrapper = document.getElementById("panzoom-wrapper");
  const content = document.getElementById("panzoom-content");

  let scale = 1;
  let originX = 0;
  let originY = 0;
  let lastX = 0;
  let lastY = 0;
  let isDragging = false;

  function updateTransform() {
    content.style.transform = `translate(${originX}px, ${originY}px) scale(${scale})`;
  }

  wrapper.addEventListener("wheel", e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    scale *= delta;
    updateTransform();
  });

  wrapper.addEventListener("pointerdown", e => {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
  });

  wrapper.addEventListener("pointermove", e => {
    if (!isDragging) return;
    originX += (e.clientX - lastX);
    originY += (e.clientY - lastY);
    lastX = e.clientX;
    lastY = e.clientY;
    updateTransform();
  });

  wrapper.addEventListener("pointerup", () => isDragging = false);
  wrapper.addEventListener("pointerleave", () => isDragging = false);

  /* Touch pinch zoom */
  let lastDist = 0;

  wrapper.addEventListener("touchmove", e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const [t1, t2] = e.touches;
      const dist = Math.hypot(t1.pageX - t2.pageX, t1.pageY - t2.pageY);

      if (lastDist) {
        scale *= dist / lastDist;
        updateTransform();
      }
      lastDist = dist;
    }
  });

  wrapper.addEventListener("touchend", () => lastDist = 0);
})();
</script>
