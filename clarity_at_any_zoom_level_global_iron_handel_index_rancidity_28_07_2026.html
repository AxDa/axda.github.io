<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>axd_Storyboard Viewer: clarity_at_any_zoom_level_global_iron_handel_index_rancidity_28_07_2026.html</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  main {
    flex: 1;
    overflow: hidden;
    position: relative;
    touch-action: none;
  }

  /* IMPORTANT: do NOT force scaling */
  embed {
    width: auto;
    height: auto;
    display: block;
  }

  #panzoom-wrapper {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
  }

  #zoom-controls {
    position: absolute;
    top: 15px;
    left: 15px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
  }

  #zoom-controls button {
    width: 40px;
    height: 40px;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 6px;
    background: #333;
    color: #eee;
    border: 1px solid #555;
  }
</style>
</head>

<body>

<main>
  <div id="zoom-controls">
    <button id="zoom-in">+</button>
    <button id="zoom-out">−</button>
    <button id="zoom-reset">⟳</button>
  </div>

  <div id="panzoom-wrapper">
    <embed id="svgEmbed" src="rancidity.svg" type="image/svg+xml"></embed>
  </div>
</main>

<script>
(function() {
  const wrapper = document.getElementById("panzoom-wrapper");
  const svgEmbed = document.getElementById("svgEmbed");

  let svg, vb;
  let viewX = 0, viewY = 0, viewW = 100, viewH = 100;

  svgEmbed.addEventListener("load", () => {
    svg = svgEmbed.getSVGDocument().querySelector("svg");
    vb = svg.viewBox.baseVal;

    console.log("viewBox:", vb.x, vb.y, vb.width, vb.height);

    // --- CORRECT INITIALIZATION FOR TALL SVG ---
    viewX = vb.x;
    viewY = vb.y;

    // Fit width (4888 px)
    viewW = vb.width;

    // Show only one screen-height slice (~900 px)
    viewH = wrapper.clientHeight;

    updateViewBox();
  });

  function updateViewBox() {
    svg.setAttribute("viewBox", `${viewX} ${viewY} ${viewW} ${viewH}`);
  }

  function zoomAt(factor, cx, cy) {
    const px = viewX + (cx / wrapper.clientWidth) * viewW;
    const py = viewY + (cy / wrapper.clientHeight) * viewH;

    viewW /= factor;
    viewH /= factor;

    viewX = px - (cx / wrapper.clientWidth) * viewW;
    viewY = py - (cy / wrapper.clientHeight) * viewH;

    updateViewBox();
  }

  document.getElementById("zoom-in").onclick = () =>
    zoomAt(1.2, wrapper.clientWidth / 2, wrapper.clientHeight / 2);

  document.getElementById("zoom-out").onclick = () =>
    zoomAt(0.8, wrapper.clientWidth / 2, wrapper.clientHeight / 2);

  document.getElementById("zoom-reset").onclick = () => {
    viewX = vb.x;
    viewY = vb.y;
    viewW = vb.width;
    viewH = wrapper.clientHeight;
    updateViewBox();
  };

  wrapper.addEventListener("pointerdown", e => {
    wrapper.setPointerCapture(e.pointerId);
    lastX = e.clientX;
    lastY = e.clientY;
    dragging = true;
  });

  let dragging = false;
  let lastX = 0, lastY = 0;

  wrapper.addEventListener("pointermove", e => {
    if (!dragging) return;

    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;

    viewX -= dx * (viewW / wrapper.clientWidth);
    viewY -= dy * (viewH / wrapper.clientHeight);

    lastX = e.clientX;
    lastY = e.clientY;

    updateViewBox();
  });

  wrapper.addEventListener("pointerup", () => dragging = false);

})();
</script>

</body>
</html>
